<!DOCTYPE html>
<html Lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta nome="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex aling-items-center vh-100">
    <div class="container">
        <div class="row-justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <h3 class="text-center mb-4">

                    <form onsubmit="login(event)">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" class="form-control" placeholder="Digite seu Usuario" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="text" id="password" class="form-control" placeholder="Digite sua Senha" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>

                    <div class="text-center">
                        <small>Não tem uma Conta? <a href="signup.html">Cadastre-se</a></small>
                    </div>
                    </h3>
                </div>
            </div>
        </div>
    </div>
</body>
